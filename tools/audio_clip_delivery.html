<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Clip Delivery</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-4">
<h1 class="text-2xl font-bold mb-4">🎧 Audio Clip Delivery</h1>
<div id="clips" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
<script>
async function loadClips(){
  const res = await fetch('/tools/audio_clip_delivery.py');
  const clips = await res.json();
  const container = document.getElementById('clips');
  container.innerHTML='';
  clips.forEach(c=>{
    const card = document.createElement('div');
    card.className='bg-white rounded shadow p-4';
    card.innerHTML=`<h2 class="font-semibold">${c.name}</h2>
      <audio controls src="/${c.mp3}"></audio>
      <p class="text-sm text-gray-600 mt-2">Preview: <audio controls src="/${c.preview}"></audio></p>`;
    container.appendChild(card);
  });
}
loadClips();
</script>
</body>
</html>
